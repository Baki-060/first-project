
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIHAM ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  overflow:hidden;
  height:100vh;
  font-family:monospace;
}

canvas{display:block}

.name{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:#ffb6d9;
  font-size:32px;
  font-family:cursive;
  text-align:center;
  text-shadow:0 0 10px #ff007f,0 0 30px #ff007f;
  opacity:0;
  animation:show 3s forwards 2s;
  white-space:nowrap;
}

.love{
  margin-top:15px;
  font-size:27px;
  color:#ff168f;
  font-family:cursive;
  text-shadow:0 0 10px #ff0088,0 0 25px #ff0088;
}

@keyframes show{to{opacity:1}}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="name">
  SIHAM ❤️
  <div class="love">I Love You ❤️</div>
</div>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let w,h,particles=[];

function resize(){
 w=c.width=innerWidth;
 h=c.height=innerHeight;
}

resize();
window.onresize=resize;

function point(t){
 return {
  x:16*Math.pow(Math.sin(t),3),
  y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
 };
}

for(let i=0;i<700;i++){
 let t=Math.random()*Math.PI*2;
 particles.push({
  t,
  spread:Math.random()*2.5,
  x:Math.random()*w,
  y:Math.random()*h,
  speed:0.008+Math.random()*0.02,
  char:Math.random()<.5?"0":"1"
 });
}

function draw(){
 ctx.clearRect(0,0,w,h);

 let scale=Math.min(w,h)/38;
 let pulse=1+Math.sin(Date.now()*.002)*.035;
 let cx=w/2,cy=h/2;

 particles.forEach((a,i)=>{
  let p=point(a.t);
  let tx=cx+p.x*scale*pulse;
  let ty=cy+p.y*scale*pulse;

  a.x+=(tx-a.x)*.035;
  a.y+=(ty-a.y)*.035;
  a.t+=a.speed;

  ctx.fillStyle=i%3===0?"#ff65c5":"#ff168f";
  ctx.shadowColor="#ff0088";
  ctx.shadowBlur=8;
  ctx.font="12px monospace";
  ctx.fillText(a.char,a.x+a.spread,a.y);
 });

 ctx.shadowBlur=0;
 requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
